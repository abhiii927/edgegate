name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev tools
        run: python -m pip install --upgrade pip ruff mypy pytest
      - name: Lint with ruff
        run: ruff check .
      - name: Type check with mypy
        run: mypy limiter.py health.py proxy.py test_attack.py tests
      - name: Run tests with pytest
        run: pytest -v
